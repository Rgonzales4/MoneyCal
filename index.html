<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Money Calculator</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fdf0f3;
        --surface: #fff5f7;
        --surface2: #fde8ed;
        --border: #f2c8d2;
        --accent: #c95c7a;
        --accent2: #a8425e;
        --text: #3a2028;
        --muted: #b07080;
        --green: #7a9e6e;
        --radius: 10px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-weight: 400;
        min-height: 100vh;
        padding: 32px 16px 80px;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: radial-gradient(
          circle,
          #f2b8c6 1px,
          transparent 1px
        );
        background-size: 28px 28px;
        pointer-events: none;
        z-index: 0;
        opacity: 0.3;
      }

      .wrap {
        max-width: 760px;
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }

      header {
        display: flex;
        align-items: baseline;
        gap: 16px;
        margin-bottom: 40px;
        border-bottom: 1px solid var(--border);
        padding-bottom: 24px;
        flex-wrap: wrap;
      }

      header h1 {
        font-family: "Bebas Neue", sans-serif;
        font-size: clamp(48px, 8vw, 72px);
        letter-spacing: 2px;
        color: var(--accent);
        line-height: 1;
      }

      header span {
        font-size: 13px;
        color: var(--muted);
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 24px;
        margin-bottom: 20px;
      }

      .card-title {
        font-family: "Bebas Neue", sans-serif;
        font-size: 22px;
        letter-spacing: 1.5px;
        color: var(--accent);
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .card-title .num {
        background: var(--accent);
        color: var(--bg);
        font-size: 12px;
        font-family: "DM Sans", sans-serif;
        font-weight: 700;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        display: grid;
        place-items: center;
      }

      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }

      input[type="number"] {
        width: 100%;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 10px 14px;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s;
        -moz-appearance: textfield;
      }

      input[type="number"]::-webkit-inner-spin-button,
      input[type="number"]::-webkit-outer-spin-button {
        -webkit-appearance: none;
      }

      input:focus {
        border-color: var(--accent);
      }

      .input-prefix {
        position: relative;
      }
      .input-prefix span {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        font-size: 14px;
        pointer-events: none;
      }
      .input-prefix input {
        padding-left: 26px;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      @media (max-width: 480px) {
        .grid-2 {
          grid-template-columns: 1fr;
        }
      }

      /* Money rows */
      .money-section-label {
        font-family: "Bebas Neue", sans-serif;
        font-size: 18px;
        letter-spacing: 1.5px;
        color: var(--accent);
        margin-bottom: 14px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--border);
      }

      .money-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .money-row {
        display: grid;
        grid-template-columns: 60px 1fr 90px;
        gap: 10px;
        align-items: center;
        background: var(--surface2);
        border: 1px solid var(--border);
        padding: 10px 14px;
        border-radius: 8px;
      }

      .money-row .denom {
        font-weight: 700;
        color: var(--accent);
        font-size: 15px;
      }

      .money-row input {
        background: var(--surface);
      }

      .money-row .ind-total {
        text-align: right;
        font-family: "DM Sans", sans-serif;
        font-weight: 600;
        color: var(--text);
        font-size: 14px;
      }

      /* Calculate button */
      .btn-calc {
        width: 100%;
        background: var(--accent);
        color: var(--bg);
        border: none;
        border-radius: var(--radius);
        padding: 16px;
        font-family: "Bebas Neue", sans-serif;
        font-size: 22px;
        letter-spacing: 2px;
        cursor: pointer;
        transition: all 0.2s;
        margin-top: 8px;
      }
      .btn-calc:hover {
        background: var(--accent2);
        transform: translateY(-1px);
      }
      .btn-calc:active {
        transform: translateY(0);
      }

      /* Total banner */
      .total-banner {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px 20px;
        margin-top: 16px;
      }

      .total-banner .label {
        font-family: "Bebas Neue", sans-serif;
        font-size: 20px;
        letter-spacing: 1.5px;
        color: var(--accent);
      }

      .total-banner .value {
        font-family: "Bebas Neue", sans-serif;
        font-size: 28px;
        letter-spacing: 1px;
        color: var(--green);
      }

      /* Breakdown */
      .breakdown-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .breakdown-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 18px;
      }

      .breakdown-row .label {
        font-weight: 600;
        font-size: 15px;
      }

      .breakdown-row .sub {
        display: block;
        font-size: 11px;
        font-weight: 400;
        color: var(--muted);
        margin-top: 2px;
      }

      .breakdown-row .value {
        font-family: "Bebas Neue", sans-serif;
        font-size: 22px;
        letter-spacing: 1px;
        color: var(--text);
      }

      .breakdown-row.total-row {
        background: var(--accent);
        border-color: var(--accent);
      }
      .breakdown-row.total-row .label,
      .breakdown-row.total-row .value {
        color: var(--bg);
      }
      .breakdown-row.total-row .value {
        color: #fff5f7;
      }

      .divider {
        border: none;
        border-top: 1px solid var(--border);
        margin: 20px 0;
      }

      /* Float selector */
      .float-row {
        margin-top: 16px;
      }

      .mode-tabs {
        display: flex;
        border: 1px solid var(--border);
        border-radius: 8px;
        overflow: hidden;
        background: var(--surface2);
        max-width: 240px;
      }

      .mode-tab {
        flex: 1;
        background: none;
        border: none;
        padding: 9px 14px;
        font-family: "DM Sans", sans-serif;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
        cursor: pointer;
        transition: all 0.15s;
        text-align: center;
      }

      .mode-tab.active {
        background: var(--accent);
        color: #fff0f3;
      }

      @media (max-width: 480px) {
        body {
          padding: 20px 12px 60px;
        }
        .card {
          padding: 18px;
        }
        .money-row {
          grid-template-columns: 50px 1fr 80px;
          gap: 8px;
          padding: 10px 12px;
        }
        .breakdown-row {
          padding: 12px 14px;
        }
        .breakdown-row .value {
          font-size: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>MONEY</h1>
        <span>Cash Calculator</span>
      </header>

      <!-- TILL TOTALS -->
      <div class="card">
        <div class="card-title"><span class="num">1</span> Till Totals</div>
        <div class="grid-2">
          <div>
            <label>EFTPOS</label>
            <div class="input-prefix">
              <span>$</span>
              <input type="number" id="eftpos" placeholder="0.00" step="0.01" />
            </div>
          </div>
          <div>
            <label>Petty</label>
            <div class="input-prefix">
              <span>$</span>
              <input type="number" id="petty" placeholder="0.00" step="0.01" />
            </div>
          </div>
        </div>
        <div class="float-row">
          <label>Float in Till</label>
          <div class="mode-tabs" id="float-tabs">
            <button
              type="button"
              class="mode-tab"
              id="float-tab-500"
              onclick="setFloat(500)"
            >
              $500
            </button>
            <button
              type="button"
              class="mode-tab active"
              id="float-tab-600"
              onclick="setFloat(600)"
            >
              $600
            </button>
          </div>
        </div>
      </div>

      <!-- NOTES & COINS -->
      <div class="card">
        <div class="card-title"><span class="num">2</span> Cash Count</div>
        <div class="grid-2">
          <!-- NOTES -->
          <div>
            <div class="money-section-label">Notes</div>
            <div class="money-list">
              <div class="money-row">
                <div class="denom">$100</div>
                <input
                  type="number"
                  id="hundreds"
                  placeholder="0"
                  onkeyup="individualTotal('hundreds','indHundreds', 100)"
                  onkeypress="preventNonNumericalInput(event)"
                />
                <div class="ind-total" id="indHundreds">$0.00</div>
              </div>
              <div class="money-row">
                <div class="denom">$50</div>
                <input
                  type="number"
                  id="fifties"
                  placeholder="0"
                  onkeyup="individualTotal('fifties','indFifties', 50)"
                  onkeypress="preventNonNumericalInput(event)"
                />
                <div class="ind-total" id="indFifties">$0.00</div>
              </div>
              <div class="money-row">
                <div class="denom">$20</div>
                <input
                  type="number"
                  id="twenties"
                  placeholder="0"
                  onkeyup="individualTotal('twenties','indTwenties', 20)"
                  onkeypress="preventNonNumericalInput(event)"
                />
                <div class="ind-total" id="indTwenties">$0.00</div>
              </div>
              <div class="money-row">
                <div class="denom">$10</div>
                <input
                  type="number"
                  id="tens"
                  placeholder="0"
                  onkeyup="individualTotal('tens','indTens', 10)"
                  onkeypress="preventNonNumericalInput(event)"
                />
                <div class="ind-total" id="indTens">$0.00</div>
              </div>
              <div class="money-row">
                <div class="denom">$5</div>
                <input
                  type="number"
                  id="fives"
                  placeholder="0"
                  onkeyup="individualTotal('fives','indFives', 5)"
                  onkeypress="preventNonNumericalInput(event)"
                />
                <div class="ind-total" id="indFives">$0.00</div>
              </div>
            </div>
          </div>

          <!-- COINS -->
          <div>
            <div class="money-section-label">Coins</div>
            <div class="money-list">
              <div class="money-row">
                <div class="denom">$2</div>
                <input
                  type="number"
                  id="twos"
                  placeholder="0"
                  onkeyup="individualTotal('twos','indTwos', 2)"
                  onkeypress="preventNonNumericalInput(event)"
                />
                <div class="ind-total" id="indTwos">$0.00</div>
              </div>
              <div class="money-row">
                <div class="denom">$1</div>
                <input
                  type="number"
                  id="ones"
                  placeholder="0"
                  onkeyup="individualTotal('ones','indOnes', 1)"
                  onkeypress="preventNonNumericalInput(event)"
                />
                <div class="ind-total" id="indOnes">$0.00</div>
              </div>
              <div class="money-row">
                <div class="denom">50c</div>
                <input
                  type="number"
                  id="fiftyCents"
                  placeholder="0"
                  onkeyup="individualTotal('fiftyCents','indFiftyCents', 0.5)"
                  onkeypress="preventNonNumericalInput(event)"
                />
                <div class="ind-total" id="indFiftyCents">$0.00</div>
              </div>
              <div class="money-row">
                <div class="denom">20c</div>
                <input
                  type="number"
                  id="twentyCents"
                  placeholder="0"
                  onkeyup="individualTotal('twentyCents','indTwentyCents', 0.2)"
                  onkeypress="preventNonNumericalInput(event)"
                />
                <div class="ind-total" id="indTwentyCents">$0.00</div>
              </div>
              <div class="money-row">
                <div class="denom">10c</div>
                <input
                  type="number"
                  id="tenCents"
                  placeholder="0"
                  onkeyup="individualTotal('tenCents','indTenCents', 0.1)"
                  onkeypress="preventNonNumericalInput(event)"
                />
                <div class="ind-total" id="indTenCents">$0.00</div>
              </div>
              <div class="money-row">
                <div class="denom">5c</div>
                <input
                  type="number"
                  id="fiveCents"
                  placeholder="0"
                  onkeyup="individualTotal('fiveCents','indFiveCents', 0.05)"
                  onkeypress="preventNonNumericalInput(event)"
                />
                <div class="ind-total" id="indFiveCents">$0.00</div>
              </div>
            </div>
          </div>
        </div>

        <button class="btn-calc" onclick="solve()">CALCULATE</button>

        <div class="total-banner">
          <div class="label">Total</div>
          <div class="value" id="totalText">$0.00</div>
        </div>
      </div>

      <!-- BREAKDOWN -->
      <div class="card">
        <div class="card-title"><span class="num">3</span> Breakdown</div>
        <div class="breakdown-list">
          <div class="breakdown-row">
            <div class="label">EFTPOS</div>
            <div class="value" id="eftposValue">$0.00</div>
          </div>
          <div class="breakdown-row">
            <div class="label">
              Cash Profit
              <span class="sub" id="cashProfitSub"
                >(Excluding $600 float in Till)</span
              >
            </div>
            <div class="value" id="cashProfit">$0.00</div>
          </div>
          <div class="breakdown-row">
            <div class="label">Petty</div>
            <div class="value" id="pettyValue">$0.00</div>
          </div>
          <hr class="divider" />
          <div class="breakdown-row total-row">
            <div class="label">Profit Total</div>
            <div class="value" id="breakdownTotal">$0.00</div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let floatTotal = 600;

      function setFloat(value) {
        floatTotal = value;
        
        document
          .getElementById("float-tab-500")
          .classList.toggle("active", value === 500);
        document
          .getElementById("float-tab-600")
          .classList.toggle("active", value === 600);

        document.getElementById("cashProfitSub").innerHTML =
          "(Excluding $" + value + " float in Till)";
      }

      // Evaluate the numbers
      function solve() {
        let hundredsTotal = document.getElementById("hundreds").value * 100;
        let fiftiesTotal = document.getElementById("fifties").value * 50;
        let twentiesTotal = document.getElementById("twenties").value * 20;
        let tensTotal = document.getElementById("tens").value * 10;
        let fivesTotal = document.getElementById("fives").value * 5;
        let twosTotal = document.getElementById("twos").value * 2;
        let onesTotal = document.getElementById("ones").value * 1;
        let fiftyCentsTotal = document.getElementById("fiftyCents").value * 0.5;
        let twentyCentsTotal =
          document.getElementById("twentyCents").value * 0.2;
        let tenCentsTotal = document.getElementById("tenCents").value * 0.1;
        let fiveCentsTotal = document.getElementById("fiveCents").value * 0.05;
        let eftposTotal = document.getElementById("eftpos").value * 1;
        let pettyTotal = document.getElementById("petty").value * 1;
        let finalTotal =
          hundredsTotal +
          fiftiesTotal +
          twentiesTotal +
          tensTotal +
          fivesTotal +
          twosTotal +
          onesTotal +
          fiftyCentsTotal +
          twentyCentsTotal +
          tenCentsTotal +
          fiveCentsTotal +
          eftposTotal +
          pettyTotal;
        // Subtract the float that always stays in the till (500 or 600)
        let cashTotal = finalTotal - eftposTotal - pettyTotal - floatTotal;
        document.getElementById("totalText").innerHTML =
          "$" + finalTotal.toFixed(2);
        document.getElementById("eftposValue").innerHTML =
          "$" + eftposTotal.toFixed(2);
        document.getElementById("pettyValue").innerHTML =
          "$" + pettyTotal.toFixed(2);
        document.getElementById("cashProfit").innerHTML =
          "$" + cashTotal.toFixed(2);
        document.getElementById("breakdownTotal").innerHTML =
          "$" + (eftposTotal + pettyTotal + cashTotal).toFixed(2);
      }

      // Prevent letters in input
      function preventNonNumericalInput(e) {
        e = e || window.event;
        var charCode = typeof e.which == "undefined" ? e.keyCode : e.which;
        var charStr = String.fromCharCode(charCode);
        if (!charStr.match(/^[0-9]+$/)) e.preventDefault();
      }

      // Individual total for each Note and Coin values
      function individualTotal(from, to, number) {
        document.getElementById(to).innerHTML =
          "$" + (document.getElementById(from).value * number).toFixed(2);
      }
    </script>
  </body>
</html>
